name: Linlin DNS UpdateRules
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */1 * * *"
  push:
    branches:
      - main
  release:
    types:
      - published

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 获取最新代码
        run: |
          git init
          git config --local user.email "1732509260@qq.com"
          git config --local user.name "Linlin"
          git fetch --all
          git reset --hard origin/main
          git pull
          git branch -m main

      - name: 恢复 DNS 缓存
        uses: actions/cache@v4
        with:
          path: |
            dns-cache.json
            smartdns.cache
          key: dns-cache-${{ github.run_id }}
          restore-keys: |
            dns-cache-

      - name: 启动 SmartDNS
        run: |
          mkdir -p smartdns-cache
          docker run -d --name smartdns \
            -p 5053:5053/udp -p 5053:5053/tcp \
            -v ${{ github.workspace }}/data/configs/smartdns.conf:/etc/smartdns/smartdns.conf \
            -v ${{ github.workspace }}/smartdns-cache:/var/cache/smartdns \
            pymumu/smartdns:latest smartdns -c /etc/smartdns/smartdns.conf
          sleep 5

      - name: 等待 SmartDNS 就绪
        run: |
          for i in {1..10}; do
            if nslookup github.com 127.0.0.1 -port=5053 > /dev/null 2>&1; then
              echo "SmartDNS 就绪"
              exit 0
            fi
            echo "等待 SmartDNS... ($i)"
            sleep 2
          done
          echo "SmartDNS 启动超时"
          docker logs smartdns
          exit 1

      - name: 运行
        run: |
          npm install
          node index

      - name: 保存 DNS 缓存
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            dns-cache.json
            smartdns-cache
          key: dns-cache-${{ github.run_id }}

      - name: 更新文件
        run: |
          git add --all
          git commit -m "Updated at $(TZ=UTC-8 date +'%Y-%m-%d %H:%M:%S')（北京时间）" || echo "无变更"
          git push -u origin -f

      - name: 删除 workflow 运行记录
        uses: Mattraks/delete-workflow-runs@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 0
