name: Linlin DNS UpdateRules
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */1 * * *"
  push:
    branches:
      - main
  release:
    types:
      - published

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Git
        run: |
          git config user.name "Linlin"
          git config user.email "1732509260@qq.com"

      - name: 恢复 DNS 缓存
        uses: actions/cache@v4
        with:
          path: |
            dns-cache.json
            smartdns-cache
          key: dns-cache-${{ github.run_id }}
          restore-keys: |
            dns-cache-

      - name: 启动 SmartDNS
        run: |
          mkdir -p smartdns-cache
          docker run -d --name smartdns \
            --network host \
            -v ${{ github.workspace }}/data/configs/smartdns.conf:/etc/smartdns/smartdns.conf \
            -v ${{ github.workspace }}/smartdns-cache:/var/cache/smartdns \
            pymumu/smartdns:latest smartdns -f -c /etc/smartdns/smartdns.conf
          sleep 5

      - name: 等待 SmartDNS 就绪
        run: |
          for i in {1..15}; do
            if dig @127.0.0.1 -p 5053 github.com +short +time=2 +tries=1 > /dev/null 2>&1; then
              echo "SmartDNS 就绪"
              exit 0
            fi
            echo "等待 SmartDNS... ($i)"
            sleep 2
          done
          echo "=== 启动超时，排查信息 ==="
          docker ps -a
          docker logs smartdns
          ss -tulnp | grep 5053 || echo "5053 未监听"
          cat data/configs/smartdns.conf
          exit 1

      - name: 运行
        run: |
          npm install
          node --max-old-space-size=4096 index

      - name: 修复缓存目录权限
        if: always()
        run: |
          sudo chown -R $USER:$USER smartdns-cache || true
          sudo chown -R $USER:$USER dns-cache.json || true

      - name: 保存 DNS 缓存
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            dns-cache.json
            smartdns-cache
          key: dns-cache-${{ github.run_id }}

      - name: 更新文件
        run: |
          git add rules.txt allow.txt README.md
          git add data/remove/ 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
            exit 0
          fi

          git commit -m "Updated at $(TZ=UTC-8 date +'%Y-%m-%d %H:%M:%S')（北京时间）"

          for i in 1 2 3 4 5; do
            if git push; then
              echo "push 成功"
              exit 0
            fi
            echo "push 失败，第 $i 次重试..."
            sleep 15
          done

          echo "push 连续失败"
          exit 1

      - name: 删除 workflow 运行记录
        uses: Mattraks/delete-workflow-runs@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 0