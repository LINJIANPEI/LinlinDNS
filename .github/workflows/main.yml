name: Linlin DNS UpdateRules
on:
  workflow_dispatch:
    inputs:
      cache_mode:
        description: "缓存模式"
        type: choice
        required: true
        default: "C 要读要写"
        options:
          - "A 不读不写"
          - "B 只读不写"
          - "C 要读要写"
          - "D 只写不读"
  schedule:
    - cron: "0 */12 * * *"
  push:
    branches:
      - main
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

env:
  NODE_OPTIONS: "--max-old-space-size=8192"
  CACHE_READ: ${{ (github.event_name != 'workflow_dispatch' || startsWith(inputs.cache_mode, 'B') || startsWith(inputs.cache_mode, 'C')) && 'true' || 'false' }}
  CACHE_WRITE: ${{ (github.event_name != 'workflow_dispatch' || startsWith(inputs.cache_mode, 'C') || startsWith(inputs.cache_mode, 'D')) && 'true' || 'false' }}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Git
        run: |
          git config user.name "Linlin"
          git config user.email "1732509260@qq.com"

      - name: 显示缓存模式
        run: |
          echo "触发方式: ${{ github.event_name }}"
          echo "手动选择: ${{ inputs.cache_mode || '（非手动触发）' }}"
          echo "CACHE_READ   = $CACHE_READ"
          echo "CACHE_WRITE  = $CACHE_WRITE"
          echo "NODE_OPTIONS = $NODE_OPTIONS"
          echo "Node 版本    = $(node --version)"

      - name: 恢复 DNS 缓存
        if: env.CACHE_READ == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            dns-cache.json
            smartdns-cache
          key: dns-cache-${{ github.run_id }}
          restore-keys: |
            dns-cache-

      - name: 检查旧缓存格式
        if: env.CACHE_READ == 'true'
        run: |
          if [ ! -f dns-cache.json ]; then
            echo "无缓存，跳过"
            exit 0
          fi
          head=$(head -c 64 dns-cache.json | tr -d '[:space:]')
          case "$head" in
            \{*)
              size=$(stat -c%s dns-cache.json)
              echo "⚠️ 旧格式缓存，体积 $((size/1024/1024)) MB"
              if [ "$size" -gt 104857600 ]; then
                echo "> 100MB，删除以免 OOM"
                rm -f dns-cache.json
              fi
              ;;
            *)
              echo "✓ 已是 NDJSON 格式"
              ;;
          esac

      # ★ 先启动 SmartDNS（此时 iptables 规则还没加，Docker 拉镜像正常）
      - name: 启动 SmartDNS
        run: |
          mkdir -p smartdns-cache
          docker run -d --name smartdns \
            --network host \
            -v ${{ github.workspace }}/data/configs/smartdns.conf:/etc/smartdns/smartdns.conf \
            -v ${{ github.workspace }}/smartdns-cache:/var/cache/smartdns \
            pymumu/smartdns:latest smartdns -f -c /etc/smartdns/smartdns.conf
          sleep 5

      - name: 等待 SmartDNS 就绪
        run: |
          for i in {1..15}; do
            if dig @127.0.0.1 -p 5053 github.com +short +time=2 +tries=1 > /dev/null 2>&1; then
              echo "SmartDNS 就绪（5053 端口）"
              exit 0
            fi
            echo "等待 SmartDNS... ($i)"
            sleep 2
          done
          echo "=== 启动超时，排查信息 ==="
          docker ps -a
          docker logs smartdns
          ss -tulnp | grep -E ':(53|5053)' || echo "53/5053 未监听"
          cat data/configs/smartdns.conf
          exit 1

      # ★ SmartDNS 就绪后再加 iptables 规则
      # ★ 只转发目标为 127.0.0.1:53 的查询，不影响 Docker/systemd-resolved
      - name: 转发 53 到 5053
        run: |
          sudo iptables -t nat -A OUTPUT -p udp -d 127.0.0.1 --dport 53 -j REDIRECT --to-port 5053
          sudo iptables -t nat -A OUTPUT -p tcp -d 127.0.0.1 --dport 53 -j REDIRECT --to-port 5053
          echo "=== 当前 NAT 规则 ==="
          sudo iptables -t nat -L OUTPUT -n -v
          # 验证转发：查询 127.0.0.1:53 应该能拿到结果
          if dig @127.0.0.1 -p 53 github.com +short +time=2 +tries=1 > /dev/null 2>&1; then
            echo "✓ 53 → 5053 转发生效"
          else
            echo "⚠️ 53 → 5053 转发未生效"
            exit 1
          fi

      - name: 运行
        id: run_rules
        run: |
          npm install
          node index.js

      - name: 修复缓存目录权限
        if: always()
        run: |
          sudo chown -R $USER:$USER smartdns-cache 2>/dev/null || true
          sudo chown -R $USER:$USER dns-cache.json 2>/dev/null || true

      - name: 保存 DNS 缓存
        uses: actions/cache/save@v4
        if: always() && env.CACHE_WRITE == 'true'
        continue-on-error: true
        with:
          path: |
            dns-cache.json
            smartdns-cache
          key: dns-cache-${{ github.run_id }}

      - name: 更新文件
        if: steps.run_rules.outcome == 'success'
        run: |
          git add rules.txt allow.txt README.md
          git add data/remove/ 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
            exit 0
          fi

          git commit -m "Updated at $(TZ=UTC-8 date +'%Y-%m-%d %H:%M:%S')（北京时间） [skip ci]"

          for i in 1 2 3 4 5; do
            if git push; then
              echo "push 成功"
              exit 0
            fi
            echo "push 失败，第 $i 次重试..."
            sleep 15
          done

          echo "push 连续失败"
          exit 1

      - name: 删除 workflow 运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 1
